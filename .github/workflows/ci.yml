name: AeroVital Ultimate Pipeline (CI/CD)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 Lint Intelligence Audit
        run: npm run lint

      - name: 🏗️ Production Build Genesis
        run: npm run build
